user  nginx;
worker_processes  1;  # Limit to 1 process for a 1-core CPU
worker_rlimit_nofile 10240;  # Set a lower limit on the number of open files to match the server's capacity

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 10240;  # Lower the number of worker connections to avoid overloading the system
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log settings
    log_format custom_format '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             '$request_time $upstream_response_time $pipe';

    access_log  /var/log/nginx/access.log custom_format;

    # Enable efficient file transmission and reduce latency
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  600;   # Shorten the keepalive timeout to free resources quicker
    keepalive_requests 200;  # Lower the number of keep-alive requests per connection

    gzip on;  # Enable gzip compression to save bandwidth

    # Reduce buffer sizes to fit available memory
    client_body_buffer_size 256k;  # Reduce body buffer size
    client_header_buffer_size 1k;  # Reduce header buffer size
    large_client_header_buffers 4 8k;  # Lower the number of large buffers for headers

    include /etc/nginx/conf.d/*.conf;
}
